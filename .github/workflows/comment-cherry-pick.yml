name: Cherry Pick PR
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to cherry-pick'
        required: true
      target_branch:
        description: 'Target branch'
        required: true
  issue_comment:
    types: [created]

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    # For comment triggers: only run on PR comments (not issue comments) from
    # authorized users, matching the /cherry-pick <branch> command.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/cherry-pick '))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve inputs
        id: inputs
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Safely parse branch name from the comment body via env var (not direct interpolation)
            BRANCH=$(echo "$COMMENT_BODY" | head -n1 | awk '{print $2}')
            # Validate it looks like a valid git ref
            if ! git check-ref-format --branch "$BRANCH" 2>/dev/null; then
              echo "Invalid branch name: $BRANCH"
              exit 1
            fi
            echo "pr_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "target_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "target_branch=${{ github.event.inputs.target_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6

      - uses: sdemers/cherry-pick@v2.1.0
        with:
          pr_number: ${{ steps.inputs.outputs.pr_number }}
          target_branch: ${{ steps.inputs.outputs.target_branch }}
          github_token: ${{ secrets.PR_SECRET }}
